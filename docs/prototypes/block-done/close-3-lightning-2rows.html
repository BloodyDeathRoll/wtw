.lesson p em{font-style:normal;color:var(--acc2)}
.lesson ul{list-style:none;margin-top:10px;display:grid;gap:4px;font-size:14px;color:#c9c9ce}
.unlock{position:absolute;z-index:3;left:16px;right:16px;bottom:var(--ub);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;

.unlock small{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;color:#aeb9ff}
.unlock b{font-size:15px}
.unlock .play{height:34px;padding:0 14px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:13px;background:#7b8cff;color:#0b0820}
.next{position:absolute;z-index:3;left:16px;right:16px;bottom:52px;border-radius:20px;padding:14px 16px;background:var(--e1);border:1px solid color-mix(in srgb,var(--na) 45%,transparent);display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center}
.next .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--na) 16%,transparent)}
.next .eyebrow{color:var(--na)}
.next b{display:block;font-size:17px;margin-top:2px}
.next p{font-size:12.5px;color:#aeb6bf;margin-top:1px}
.next .btn{grid-column:1/-1;height:50px;font-size:15px;background:var(--na);margin-top:4px}
.phone.tint::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 40% at 50% -5%,color-mix(in srgb,var(--acc) 26%,transparent),transparent 70%)}
</style></head><body><div class="phone aurora tint" style="--acc:#7fd1ff;--acc2:#bfe8ff;--na:#D49B3A"><div class="top"><div class="hb"><i></i><i></i><i></i></div><div class="brand"><i></i>WTW</div></div>
