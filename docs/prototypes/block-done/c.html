<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&display=swap"><link rel="stylesheet" href="base.css">
<style>
.head{position:relative;z-index:2;text-align:center;padding:6px 24px 0}
.head .eyebrow{color:var(--gold)}

.grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 34px 0}
.grid div{position:relative;aspect-ratio:2/3;border-radius:10px;background-size:cover;background-position:center;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.grid div::after{content:"✓";position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#140e02;font:800 11px/20px Inter;text-align:center}
.cap{position:relative;z-index:2;text-align:center;padding:16px 30px 0}
.cap small{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.cap p{font-size:19px;line-height:1.35;font-weight:600}
.cap p em{font-style:normal;color:var(--gold2)}
.next{position:absolute;z-index:3;left:16px;right:16px;bottom:50px;border-radius:24px;padding:18px;overflow:hidden;
  background:linear-gradient(135deg,rgba(127,209,255,.95),rgba(75,140,255,.9));color:#06121c}
.next::before{content:"⚡";position:absolute;right:-6px;top:-22px;font-size:130px;opacity:.22;transform:rotate(12deg)}
.next .eyebrow{color:#06263d}
.next h2{font-size:30px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.next p{font-size:14px;margin-top:2px;color:#0b2a40;max-width:240px}
.next .btn{margin-top:14px;background:#06121c;color:#fff}
</style></head><body><div class="phone aurora">
