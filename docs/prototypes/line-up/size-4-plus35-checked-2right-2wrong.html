<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&display=swap">
<link rel="stylesheet" href="../../../src/app/play/play.css"><style>
html,body{margin:0;width:412px;height:772px;overflow:hidden;background:#000}
.wtw-play{--font-inter:"Inter";--font-bebas:"Bebas Neue";padding:0!important;position:absolute;inset:0;width:412px;height:772px}
.app{position:absolute;inset:0;background:#000;isolation:isolate;--wtw-rgb:212,155,58}
.app::before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(120% 60% at 50% 115%,rgba(var(--wtw-rgb),.65) 0%,rgba(var(--wtw-rgb),.22) 35%,transparent 70%),linear-gradient(180deg,#000 50%,rgba(var(--wtw-rgb),.12) 100%)}
.inner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column}
.wtw-play *,.wtw-play *::before,.wtw-play *::after{animation:none!important;transition:none!important}
</style></head><body>
<div class="wtw-play"><div class="app"><div class="inner"><div class="phone arcade" style="--gacc:#17b3a3"><div class="screen game-screen">
<div class="topbar"><button class="hb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="gtitle live">POSTER 1 OF 7 · SCORE 0</div><button class="hb r"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5h.01"/></svg></button></div>
<div class="cast"><div class="cast-ask" style="grid-template-columns:65px minmax(0,1fr) 54px"><img class="cast-poster" style="width:65px;height:98px" src="https://image.tmdb.org/t/p/w342/iHMbrTHJwocsNvo5murCBw0CwTo.jpg" alt=""><div class="q"><span class="qn">Kick-Ass</span><b>2 of 4 · 2 wrong</b></div><div class="cast-clock paused"><svg viewBox="0 0 54 54"><circle class="trk" cx="27" cy="27" r="23"/><circle class="arc" cx="27" cy="27" r="23" stroke-dasharray="118 145"/></svg><span>49</span><b class="pause"><s></s><s></s></b></div></div><div class="cast-grid"><button class="cast-tile wrong locked"><span class="pic"><img class="art" src="https://image.tmdb.org/t/p/w342/z6wxnkqSTnzO1tcBui0ss7ehdm9.jpg" alt=""><span class="nm">Colin Firth</span></span><span class="tick">✕</span></button><button class="cast-tile pass locked"><span class="pic"><img class="art" src="https://image.tmdb.org/t/p/w342/3YF19rWusxWfEI59ZM33dFhasRq.jpg" alt=""><span class="nm">Julianne Moore</span></span></button><button class="cast-tile hit locked"><span class="pic"><img class="art" src="https://image.tmdb.org/t/p/w342/pFtHhih2XEaFaD3qOFyQW6q83br.jpg" alt=""><span class="nm">Aaron Taylor-Johnson<span class="ch">Dave Lizewski</span></span></span><span class="tick">✓</span></button><button class="cast-tile hit locked"><span class="pic"><img class="art" src="https://image.tmdb.org/t/p/w342/y1RtezurZYveYkVNRht7CwEgSYY.jpg" alt=""><span class="nm">Nicolas Cage<span class="ch">Damon Macready</span></span></span><span class="tick">✓</span></button><button class="cast-tile miss locked"><span class="pic"><img class="art" src="https://image.tmdb.org/t/p/w342/yq4rYmaTRC5degaOYmJQFpaiho1.jpg" alt=""><span class="nm"><small>MISSED</small>Chloë Grace Moretz<span class="ch">Mindy Macready</span></span></span></button><button class="cast-tile wrong locked"><span class="pic"><img class="art" src="https://image.tmdb.org/t/p/w342/pXm8GWTm9eIA8pUGOjvmYjlxamu.jpg" alt=""><span class="nm">Nicholas Hoult</span></span><span class="tick">✕</span></button><button class="cast-tile pass locked"><span class="pic"><img class="art" src="https://image.tmdb.org/t/p/w342/kUbUA70WPiosPT4kBJMWtGk0ASd.jpg" alt=""><span class="nm">Ed Harris</span></span></button><button class="cast-tile pass locked"><span class="pic"><img class="art" src="https://image.tmdb.org/t/p/w342/afYhNpLwpa65Yy0Q0g00FNFhzx5.jpg" alt=""><span class="nm">Sam Rockwell</span></span></button><button class="cast-tile miss locked"><span class="pic"><img class="art" src="https://image.tmdb.org/t/p/w342/3cNmatYsoifytg7TfQhI1EHow3v.jpg" alt=""><span class="nm"><small>MISSED</small>Mark Strong<span class="ch">Frank D'Amico</span></span></span></button></div><button class="cta">Next</button></div>
</div></div></div></div></div><script>
const cc = document.querySelector('.cast'), grid = document.querySelector('.cast-grid'), cs = getComputedStyle(cc)
const kids = [...cc.children].filter(el => !el.classList.contains('cast-fx'))
const others = kids.filter(el => el !== grid).reduce((s, el) => s + el.offsetHeight, 0)
const h = cc.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - others - 10 * (kids.length - 1)
grid.style.width = Math.max(200, Math.min(cc.clientWidth - 32, (h - 16) / 1.5 + 16)) + 'px'
document.title = Math.round(grid.querySelector('.cast-tile').getBoundingClientRect().width)
</script></body></html>
