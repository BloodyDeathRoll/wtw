<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&display=swap">
<link rel="stylesheet" href="../../../src/app/play/play.css"><style>
html,body{margin:0;width:412px;height:772px;overflow:hidden;background:#000}
.wtw-play{--font-inter:"Inter";--font-bebas:"Bebas Neue";padding:0!important;position:absolute;inset:0;width:412px;height:772px}
.app{position:absolute;inset:0;background:#000;isolation:isolate;--wtw-rgb:212,155,58}
.app::before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(120% 60% at 50% 115%,rgba(var(--wtw-rgb),.65) 0%,rgba(var(--wtw-rgb),.22) 35%,transparent 70%),linear-gradient(180deg,#000 50%,rgba(var(--wtw-rgb),.12) 100%)}
.inner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column}
.wtw-play *,.wtw-play *::before,.wtw-play *::after{animation:none!important;transition:none!important}
/* option B: the counter moves into the top bar; the tally line goes (the banner already says "3 of 4") */
.opt-b .gtitle,.opt-c .gtitle{font-size:22px}
.opt-b .cast-tally,.opt-c .cast-tally{display:none}
/* option C: no Check button; the 4th tap checks, and Next sits in the banner */
.cast-ask .nextpill{height:48px;padding:0 16px;border:0;border-radius:999px;background:var(--cta-grad);color:#fff;font-weight:700;font-size:17px;white-space:nowrap;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.opt-c .cast-ask.res{grid-template-columns:52px minmax(0,1fr) auto}
.opt-c .hint{text-align:center;font-size:13px;color:#a9a9b0;margin-top:-2px}
</style></head><body>
<div class="wtw-play opt-c"><div class="app"><div class="inner"><div class="phone arcade" style="--gacc:#4d8dff"><div class="screen game-screen">
<div class="topbar"><button class="hb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="gtitle">FACE 1 OF 7 · SCORE 0</div><button class="hb r"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5h.01"/></svg></button></div><div class="cast"><div class="cast-ask"><img class="face" src="https://image.tmdb.org/t/p/w185/8TlKqbXYgHmmaEoPBJ7djJ8Rxxa.jpg" alt=""><div class="q"><span class="ql">Select 4 titles with<span class="cast-dots"><i></i><i></i><i></i><i></i></span></span><b>Will Smith</b></div><div class="cast-clock"><svg viewBox="0 0 54 54"><circle class="trk" cx="27" cy="27" r="23"/><circle class="arc" cx="27" cy="27" r="23" stroke-dasharray="140 145"/></svg><span>58</span><b class="pause"><s></s><s></s></b></div></div><div class="cast-grid"><button class="cast-tile "><img class="art" src="https://image.tmdb.org/t/p/w342/iZf0KyrE25z1sage4SYFLCCrMi9.jpg" alt=""></button><button class="cast-tile "><img class="art" src="https://image.tmdb.org/t/p/w342/ykUEbfpkf8d0w49pHh0AD2KrT52.jpg" alt=""></button><button class="cast-tile "><img class="art" src="https://image.tmdb.org/t/p/w342/efwv6F2lGaghjPpBRSINHtoEiZB.jpg" alt=""></button><button class="cast-tile "><img class="art" src="https://image.tmdb.org/t/p/w342/wrFpXMNBRj2PBiN4Z5kix51XaIZ.jpg" alt=""></button><button class="cast-tile "><img class="art" src="https://image.tmdb.org/t/p/w342/iPDkaSdKk2jRLTM65UOEoKtsIZ8.jpg" alt=""></button><button class="cast-tile "><img class="art" src="https://image.tmdb.org/t/p/w342/b34jPzmB0wZy7EjUZoleXOl2RRI.jpg" alt=""></button><button class="cast-tile "><img class="art" src="https://image.tmdb.org/t/p/w342/ufCkeypovY01Dm123I2aPvGUA5H.jpg" alt=""></button><button class="cast-tile "><img class="art" src="https://image.tmdb.org/t/p/w342/enA22EPyzc2WQ1VVyY7zxresQQr.jpg" alt=""></button><button class="cast-tile "><img class="art" src="https://image.tmdb.org/t/p/w342/56As6XEM1flWvprX4LgkPl8ii4K.jpg" alt=""></button></div><div class="cast-tally"></div><div class="hint">Your fourth tap checks the grid.</div></div>
</div></div></div></div></div><script>
// The game's own rule: the grid as big as the space allows, 2:3 posters, three across.
const cc = document.querySelector('.cast'), grid = document.querySelector('.cast-grid')
const cs = getComputedStyle(cc)
const kids = [...cc.children].filter(el => getComputedStyle(el).display !== 'none' && !el.classList.contains('cast-fx'))
const others = kids.filter(el => el !== grid).reduce((s, el) => s + el.offsetHeight, 0)
const h = cc.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - others - 10 * (kids.length - 1)
grid.style.width = Math.max(200, Math.min(cc.clientWidth - 32, (h - 16) / 1.5 + 16)) + 'px'
document.title = Math.round(grid.querySelector('.cast-tile').getBoundingClientRect().width) + 'px'
</script></body></html>
