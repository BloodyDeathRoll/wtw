<title>WTW Taste Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap">
<style>
/* Layout: prototype bar on top; phone on the left; "Behind the curtain" engine panel on the right (stacks below on narrow screens).
   Single dark theme on purpose, mirroring the live WTW app: black ground, gold accent, blue/gold aurora. */
:root{
  color-scheme: dark;
  --bg:#050506; --phone:#000; --elev1:#0E0E10; --elev2:#161618; --elev3:#1E1E22;
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
  --fg:#F2F2F2; --muted:#8A8A8E; --dim:#5E5E62;
  --gold:#D49B3A; --gold-soft:rgba(212,155,58,.16); --gold-glow:rgba(212,155,58,.45);
  --blue:#4B5BFF; --blue-soft:rgba(75,91,255,.18); --good:#5BC88A; --bad:#E5675F; --bad-soft:rgba(229,103,95,.16);
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --poster:"Bebas Neue","Impact","Arial Narrow",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.45;margin:0;padding-inline:16px;padding-block:20px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.proto-bar{max-width:1080px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.proto-bar h1{font-size:15px;font-weight:600;margin:0}
.proto-bar h1 span{color:var(--muted);font-weight:400}
.proto-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.proto-btns .lbl{font-size:12px;color:var(--dim)}
.proto-btn{background:var(--elev2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--muted)}
.proto-btn:hover{color:var(--fg)}
.stage{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr);justify-items:center;gap:24px}}

/* ---------- behind the curtain ---------- */
.curtain{min-width:0;width:100%;max-width:560px;display:grid;gap:14px}
.panel{background:var(--elev1);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.panel h3{margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.phase{display:flex;gap:6px;flex-wrap:wrap}
.phase span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--dim)}
.phase span.on{color:#140e02;background:var(--gold);border-color:var(--gold);font-weight:600}
.phase span.done{color:var(--muted);border-color:var(--line-strong)}
.testing{font-size:15px;font-weight:600;margin:12px 0 4px}
.testing-why{color:#c4c4c8;font-size:13px;margin:0}
.axes{display:grid;gap:9px}
.axis{display:grid;grid-template-columns:76px minmax(0,1fr) 76px;gap:8px;align-items:center;font-size:11.5px;color:var(--muted)}
.axis .r{text-align:right}
.axis.lean-l .l,.axis.lean-r .r{color:var(--fg);font-weight:600}
.track{position:relative;height:6px;border-radius:3px;background:var(--elev3)}
.track::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line-strong)}
.dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--gold);transform:translate(-50%,-50%);transition:left .5s ease,opacity .5s ease;box-shadow:0 0 10px var(--gold-glow)}
.conf-note{font-size:11px;color:var(--dim);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:var(--gold-soft);border-radius:999px;padding:4px 10px}
.chip.neg{background:var(--bad-soft);color:#f3b0ab;text-decoration:line-through}
.chip.neu{background:var(--elev3);color:var(--muted)}
.log{display:grid;gap:6px;font-size:12.5px;color:#c4c4c8;max-height:190px;overflow-y:auto}
.log div{border-left:2px solid var(--line-strong);padding-left:9px}
.log div:first-child{border-left-color:var(--gold);color:var(--fg)}
.empty-note{color:var(--dim);font-size:12.5px}
.calib{display:grid;gap:4px;font-size:12px;font-variant-numeric:tabular-nums}
.calib div{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px 60px;gap:6px;color:#c4c4c8}
.calib div span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calib .h{color:var(--dim);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}

/* ---------- phone ---------- */
.phone{position:relative;width:100%;max-width:390px;height:780px;max-height:calc(100vh - 110px);min-height:640px;border-radius:44px;background:var(--phone);border:1px solid var(--line-strong);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.aurora{position:absolute;inset:0;pointer-events:none}
.aurora::before,.aurora::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(70px);opacity:.5}
.aurora::before{background:radial-gradient(circle,rgba(212,155,58,.55),transparent 65%);left:-200px;bottom:-230px}
.aurora::after{background:radial-gradient(circle,rgba(75,91,255,.45),transparent 65%);right:-220px;bottom:-200px}
.screen{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;animation:fadeIn .35s ease;overflow-y:auto;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;justify-content:center;padding:20px 18px 6px;min-height:56px;position:relative;flex-shrink:0}
.brand{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;letter-spacing:.06em}
.brand i{width:16px;height:16px;border-radius:4px;background:linear-gradient(135deg,var(--blue),var(--gold));display:block}
.topbar .done{position:absolute;right:16px;background:none;border:0;color:var(--muted);font-size:13px}
.topbar .left{position:absolute;left:16px;background:none;border:0;color:var(--muted);font-size:13px}

.meter{margin:6px 22px 0;display:grid;gap:5px;flex-shrink:0}
.meter-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);gap:8px}
.meter-row b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.meter-row .lvl{color:var(--gold);font-weight:600}
.lv{display:inline-grid;place-items:center;min-width:34px;height:18px;border-radius:5px;background:var(--gold);color:#140e02;font-size:10.5px;font-weight:700;margin-right:6px;padding:0 5px}
.bar{height:5px;border-radius:3px;background:var(--elev3);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f1c46d);border-radius:3px;transition:width .6s ease}
.bar .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--bg)}
.next-unlock{font-size:11px;color:var(--dim)}
.next-unlock b{color:var(--muted);font-weight:600}

.prompt{padding:16px 22px 4px;text-align:center}
.prompt h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.prompt p{margin:6px 0 0;color:var(--muted);font-size:13px;min-height:19px}
.prompt p.learned{color:var(--gold)}
.duel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px 22px 0}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.pick{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:7px;border-radius:14px;transition:transform .15s ease, opacity .3s ease}
.pick:hover .poster{transform:translateY(-3px);box-shadow:0 0 0 2px var(--line-strong),0 14px 30px rgba(0,0,0,.5)}
.pick.chosen .poster{box-shadow:0 0 0 3px var(--gold),0 0 30px var(--gold-glow);transform:scale(1.03)}
.pick.lost{opacity:.25;transform:scale(.96)}
.pick .nm{font-weight:600;font-size:14px;line-height:1.2}
.pick .yr{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pick .pitch{color:#d2d2d5;font-size:12.5px;line-height:1.35}
.unseen{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:6px 8px;font-size:12px;color:var(--muted)}
.unseen:hover{color:var(--fg);border-color:var(--line-strong)}
.poster{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;max-width:100%;transition:transform .2s ease, box-shadow .2s ease}
.poster .pt{font-family:var(--poster);font-size:24px;line-height:.92;letter-spacing:.02em;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.45);position:relative;z-index:1;word-break:break-word}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55))}
.poster .shape{position:absolute;border-radius:50%;opacity:.5}
.poster.dim{filter:saturate(.4) brightness(.6)}
.poster .qm{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--poster);font-size:64px;color:rgba(255,255,255,.18);z-index:1}
.poster .tvb{position:absolute;top:8px;left:8px;z-index:2;font-size:9.5px;font-weight:700;letter-spacing:.08em;background:rgba(0,0,0,.6);border-radius:4px;padding:2px 5px;color:#fff}
.swap-in{animation:swapIn .4s ease}
@keyframes swapIn{from{opacity:0;transform:rotateY(80deg)}to{opacity:1;transform:none}}
.actions{display:flex;justify-content:center;gap:8px;padding:14px 22px 8px;flex-wrap:wrap}
.ghost{border:1px solid var(--line-strong);background:rgba(255,255,255,.03);border-radius:999px;padding:9px 14px;font-size:13px;color:#d8d8db}
.ghost:hover{border-color:var(--gold)}
.foot{margin-top:auto;padding:10px 22px 22px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim)}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:12px}
.foot button[disabled]{opacity:.35;cursor:default;text-decoration:none}

/* intro */
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 30px 40px;gap:14px}
.intro h2{font-size:29px;line-height:1.12;margin:6px 0 0;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
.intro p{color:var(--muted);margin:0;font-size:15px;max-width:290px}
.vs-art{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.vs-art .poster{width:96px;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.vs-art .poster:first-child{transform:rotate(-6deg)}
.vs-art .poster:last-child{transform:rotate(6deg)}
.vs{font-family:var(--poster);font-size:28px;color:var(--gold)}
.cta{width:100%;max-width:300px;border:0;border-radius:999px;padding:15px;font-weight:600;font-size:15px;background:var(--gold);color:#140e02}
.cta[disabled]{background:var(--elev3);color:var(--muted);cursor:default}
.fine{font-size:12px;color:var(--dim)}

/* setup: format + genre grid */
.setup{padding:4px 22px 8px;display:flex;flex-direction:column;gap:14px}
.setup h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.setup .sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--elev2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--elev3);color:var(--fg);font-weight:600}
.ggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.gtile{position:relative;border:0;border-radius:14px;aspect-ratio:1/1;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;font-weight:600;font-size:13px;line-height:1.15;color:#fff;overflow:hidden;transition:transform .15s ease, box-shadow .15s ease, filter .15s ease}
.gtile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.5))}
.gtile span{position:relative;z-index:1}
.gtile .st{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;display:none;place-items:center;font-size:12px;font-weight:700;z-index:2}
.gtile.love{box-shadow:0 0 0 2.5px var(--gold),0 0 20px var(--gold-glow)}
.gtile.love .st{display:grid;background:var(--gold);color:#140e02}
.gtile.never{filter:grayscale(1) brightness(.45)}
.gtile.never .st{display:grid;background:var(--bad);color:#fff}
.gtile.never span{text-decoration:line-through}
.grows{display:grid;gap:6px}
.grow{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,42px);gap:6px;align-items:center;padding:6px 8px;border-radius:12px;background:var(--elev1);border:1px solid var(--line)}
.grow.rated{border-color:var(--line-strong)}
.grow.ghead{background:none;border:0;padding:0 8px}
.gh{font-size:10.5px;text-align:center;color:var(--muted);letter-spacing:.04em}
.gname{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;min-width:0}
.gname i{width:22px;height:22px;border-radius:6px;flex-shrink:0;display:block}
.gbtn{width:42px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--elev2);display:grid;place-items:center;color:var(--dim);transition:all .12s ease}
.gbtn svg{width:18px;height:18px}
.gbtn:hover{color:var(--fg);border-color:var(--line-strong)}
.gb-love[aria-pressed="true"]{color:#ff6b8a;border-color:#ff6b8a;background:rgba(255,107,138,.14)}
.gb-like[aria-pressed="true"]{color:var(--good);border-color:var(--good);background:rgba(91,200,138,.14)}
.gb-meh[aria-pressed="true"]{color:#e8c46a;border-color:#e8c46a;background:rgba(232,196,106,.12)}
.gb-never[aria-pressed="true"]{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.cta-wrap{position:absolute;left:0;right:0;bottom:0;padding:16px 22px 24px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.92) 35%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:6px}
.cta-wrap .fine{min-height:16px}
.cta-wrap.sticky{position:sticky;bottom:0;margin-top:auto;padding-top:28px}

/* interstitials (mirror / huh / level up) */
.inter{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10px 28px 40px;gap:16px;position:relative}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.inter h2{margin:0;font-size:27px;line-height:1.2;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
.inter .evidence{color:var(--muted);font-size:13px;max-width:300px}
.inter .evidence em{color:#d8d8db;font-style:normal}
.glow{position:absolute;inset:auto 0 25% 0;height:300px;background:radial-gradient(circle at 50% 50%,rgba(212,155,58,.2),transparent 60%);pointer-events:none;z-index:-1}
.opts{display:flex;flex-direction:column;gap:9px;width:100%;max-width:280px;margin-top:6px}
.opt{border:1px solid var(--line-strong);background:var(--elev2);border-radius:999px;padding:12px;font-weight:500}
.opt.primary{background:var(--gold);color:#140e02;border-color:var(--gold);font-weight:600}
.opt:hover{border-color:var(--gold)}
.skip{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.lvl-badge{width:92px;height:92px;border-radius:26px;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#f6cf7f,var(--gold) 60%,#8a5c14);color:#140e02;font-family:var(--poster);font-size:44px;box-shadow:0 0 50px var(--gold-glow);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.unlock{border:1px solid rgba(212,155,58,.4);background:var(--gold-soft);border-radius:14px;padding:12px 14px;width:100%;max-width:300px;text-align:left}
.unlock b{display:block;font-size:13px;color:var(--gold)}
.unlock span{font-size:13px;color:#e2e2e5}
.changed{font-size:13px;color:var(--muted);max-width:300px}
.changed b{color:var(--fg)}
.changed s{color:var(--dim)}

/* hub / reveal */
.reveal{padding:4px 20px 26px;display:flex;flex-direction:column;gap:14px}
.id-card{border-radius:20px;padding:22px 20px;background:radial-gradient(circle at 15% 0%,rgba(212,155,58,.28),transparent 55%),radial-gradient(circle at 100% 100%,rgba(75,91,255,.3),transparent 55%),var(--elev1);border:1px solid var(--line-strong);display:grid;gap:12px}
.id-card h2{margin:0;font-family:var(--poster);font-size:44px;line-height:.95;letter-spacing:.02em;font-weight:400;text-wrap:balance}
.truths{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.truths li{display:flex;gap:8px;font-size:13.5px;color:#e2e2e5}
.truths li::before{content:"✓";color:var(--good);font-weight:700}
.id-card .axes .axis{grid-template-columns:70px minmax(0,1fr) 70px}
.axis.edit input{width:100%;accent-color:var(--gold);margin:0}
.edit-note{font-size:12.5px;color:var(--gold)}
.sec-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 2px 0}
.ladder{display:grid;gap:6px}
.rung{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--elev1)}
.rung .n{font-family:var(--poster);font-size:20px;color:var(--dim)}
.rung b{display:block;font-size:13px}
.rung span{font-size:12px;color:var(--muted)}
.rung .s{font-size:11px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums}
.rung.got .n{color:var(--gold)}
.rung.got .s{color:var(--good)}
.rung.now{border-color:var(--gold);background:var(--gold-soft)}
.rung.locked{opacity:.55}
.recs{display:grid;gap:10px}
.rec{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center;background:var(--elev1);border:1px solid var(--line);border-radius:14px;padding:10px}
.rec .poster{padding:5px;border-radius:8px}
.rec .poster .pt{font-size:13px}
.rec b{display:block;font-size:14px}
.rec span{display:block;color:var(--muted);font-size:12px}
.rec p{margin:4px 0 0;font-size:12.5px;color:#d2d2d5}
.rec .m{color:var(--gold);font-weight:600}
.row-btns{display:flex;gap:8px}
.row-btns .opt{flex:1;padding:11px 8px;font-size:13px}
.games{display:grid;gap:8px}
.game{border:1px solid rgba(212,155,58,.4);background:var(--gold-soft);border-radius:16px;padding:13px 15px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%}
.game:hover{border-color:var(--gold)}
.game b{display:block}
.game span{color:var(--muted);font-size:12.5px}
.game .go{font-size:11px;color:#140e02;background:var(--gold);border-radius:999px;padding:4px 10px;font-weight:600}
.game.locked{background:transparent;border:1px dashed var(--line-strong);cursor:default}
.game.locked .go{background:var(--elev3);color:var(--muted)}

/* cup */
.cup-head{text-align:center;padding:4px 22px 0;display:grid;gap:4px;justify-items:center}
.cup-title{font-family:var(--poster);font-size:34px;line-height:1;color:var(--gold);letter-spacing:.04em}
.cup-sub{font-size:12.5px;color:var(--muted)}
.cup-prog{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.cup-prog i{width:14px;height:4px;border-radius:2px;background:var(--elev3);display:block}
.cup-prog i.on{background:var(--gold)}
.survivors{display:grid;gap:8px;width:100%}
.survivors .poster{padding:6px;border-radius:8px}
.survivors .poster .pt{font-size:13px}
.champ{text-align:center;display:grid;gap:8px;justify-items:center;padding:20px 18px;border-radius:20px;background:radial-gradient(circle at 50% 0%,rgba(212,155,58,.3),transparent 60%),var(--elev1);border:1px solid var(--line-strong)}
.champ-poster{width:140px;max-width:100%}
.champ h2{margin:0;font-family:var(--poster);font-size:38px;font-weight:400;line-height:1;text-wrap:balance}

<script>
/* ============ taste axes ============ */
// Every title sits somewhere on each axis (-1 … +1). Users never see these words; they only pick.
const AX=["tone","energy","pace","dark","complex","fantastic","modern","indie"];
const OPT=["humor","commit"]; // only some titles have these (comedies / series)
const LBL={tone:["Serious","Funny"],energy:["Talk","Action"],pace:["Slow burn","Fast"],dark:["Light","Dark"],complex:["Easy watch","Puzzle"],fantastic:["Real world","Other worlds"],modern:["Classic","Recent"],indie:["Blockbuster","Off-beat"],humor:["Silly","Dry wit"],commit:["Mini-series","Long haul"]};

const GENRES=[
  {id:"comedy",n:"Comedy",c:["#f2b134","#e2572f"]},
  {id:"drama",n:"Drama",c:["#6d5a8f","#251b3a"]},
  {id:"action",n:"Action",c:["#e04f2f","#3a1010"]},
  {id:"crime",n:"Crime",c:["#3e4a5c","#0d1117"]},
  {id:"thriller",n:"Thriller & mystery",c:["#5a3e6b","#120a18"]},
  {id:"scifi",n:"Sci-fi & fantasy",c:["#2f7fd6","#0d1a3a"]},
  {id:"horror",n:"Horror",c:["#8c1c1c","#0a0a0a"]},
  {id:"romance",n:"Romance",c:["#e07a9a","#5a1c35"]},
  {id:"anim",n:"Animation",c:["#45c0a8","#1d3d6e"]},
  {id:"anime",n:"Anime",c:["#e0567a","#2a1440"]},
  {id:"doc",n:"Documentary",c:["#b9a36b","#2f2a1c"]},
  {id:"war",n:"War & history",c:["#7d7a45","#1d1d10"]},
];
const GN=Object.fromEntries(GENRES.map(g=>[g.id,g.n]));

/* ============ catalog ============ */

  for(const g of GENRES)S.gen[g.id]=0;
}
const est=a=>S.sw[a]?S.sv[a]/S.sw[a]:0;
const conf=a=>1-Math.exp(-S.sw[a]/5.5);
// the genres the user chose on the setup screen stay theirs; picks only fine-tune the weights
const loves=()=>S.sel?[...S.sel]:GENRES.filter(g=>S.gen[g.id]>=1).map(g=>g.id); // love + like
const nevers=()=>GENRES.filter(g=>S.gen[g.id]<=-5).map(g=>g.id);
const knowledge=()=>{
  const base=AX.reduce((s,a)=>s+conf(a),0)/AX.length;
  const genreBonus=Object.values(S.gen).some(v=>v!==0)?.05:0;
  const crewBonus=Math.min(.08,Object.values(S.crew).filter(v=>v>=1.5).length*.04);
  const betBonus=Math.min(.08,S.betHistory.length*.01);
  const gameBonus=Math.min(.1,S.gamePlays*.025);
  return Math.min(.97,base*.8+genreBonus+crewBonus+betBonus+gameBonus+S.truths.length*.02);
};

/* ============ the brain ============ */
function allowed(t,kind){
  if(kind&&t.k!==kind)return false;
  if(S.format==="movies"&&t.k!=="m")return false;
  if(S.format==="series"&&t.k!=="tv")return false;
  if(t.g.some(g=>S.gen[g]<=-5))return false;
  if(!S.widen&&t.g.every(g=>S.gen[g]<0))return false;
  const L=loves();
  return !L.length||S.widen||t.g.some(g=>L.includes(g));
}
const avail=(t,kind)=>allowed(t,kind)&&!S.used.has(t.id)&&!S.unseen.has(t.id);
function phaseNow(){
  const broadDone=(AX.every(a=>conf(a)>=.4)&&S.round>=8)||S.round>=12;
  if(!broadDone)return "wide";
  if(narrowAxis())return "narrow";
  return "deep";
}
function narrowAxis(){
  const comedies=TITLES.filter(t=>t.humor!==undefined&&avail(t,kindFor("humor"))).length;
  if(est("tone")>.25&&conf("humor")<.5&&comedies>=2)return "humor";
  const shows=TITLES.filter(t=>t.commit!==undefined&&avail(t,"tv")).length;
  if(S.format!=="movies"&&conf("commit")<.5&&shows>=2)return "commit";
  return null;
}
function kindFor(axis){
  if(axis==="commit")return "tv";
  if(S.format==="movies")return "m";
  if(S.format==="series")return "tv";
  return S.round%3===2?"tv":"m";
}
function distToUser(t,skip){
  let d=0,n=0;
  for(const a of AX){if(a===skip||conf(a)<.4)continue;d+=Math.abs(val(t,a)-est(a));n++}
  return n?d/n:0;
}
function pickAxis(phase){
  if(S.focus){const f=S.focus;S.focus=null;return f}
  if(phase==="narrow")return narrowAxis();
  let best=null,bc=9;
  for(const a of AX){const c=conf(a);if(c<bc-.001){bc=c;best=a}}
  return best;
}
function genreAff(t){return t.g.reduce((s,g)=>s+Math.max(-1,Math.min(2,S.gen[g]||0)),0)/t.g.length}
function scorePair(x,y,a,phase){
  const dx=Math.abs(val(x,a)-val(y,a));
  let others=0;for(const b of AX)if(b!==a)others+=Math.abs(val(x,b)-val(y,b));
  const popW=phase==="wide"?1.3:.45, regW=phase==="wide"?0:.9;
  return dx*2.2-others*.3+popW*(x.pop+y.pop)-regW*(distToUser(x,a)+distToUser(y,a))+.25*(genreAff(x)+genreAff(y))+Math.random()*.2;
}
const pk=(x,y)=>[x.id,y.id].sort().join("|");
function crewPair(kind){
  const near=arr=>arr.sort((p,q)=>distToUser(p)-distToUser(q));
  for(const pool of [near(TITLES.filter(t=>t.crew&&avail(t,kind))),near(TITLES.filter(t=>t.crew&&allowed(t,kind)&&!S.unseen.has(t.id)))])
    for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++)
      if(pool[i].crew!==pool[j].crew&&!S.pairsSeen.has(pk(pool[i],pool[j])))return {a:pool[i],b:pool[j],axis:"crew"};
  return null;
}
function nextPair(){
  S.phase=phaseNow();
  if(S.bonus?.type==="creators"){const cp=crewPair(S.bonus.kind||kindFor("crew"))||crewPair(S.format==="movies"?"m":"tv");if(cp)return finalize(cp)}
  if(!S.bonus&&S.phase==="deep"&&S.round%3===0){const cp=crewPair(kindFor("crew"));if(cp)return finalize(cp)}
  const axis=pickAxis(S.phase);
  for(const kind of (S.bonus?.kind?[S.bonus.kind]:[kindFor(axis),kindFor(axis)==="m"?"tv":"m"])){
    if(axis==="commit"&&kind!=="tv")continue;
    let pool=TITLES.filter(t=>avail(t,kind));
    const reuse=pool.length<8;
    if(reuse)pool=TITLES.filter(t=>allowed(t,kind)&&!S.unseen.has(t.id));
    if(OPT.includes(axis))pool=pool.filter(t=>t[axis]!==undefined);
    if(S.bonus?.genre)pool=pool.filter(t=>t.g.includes(S.bonus.genre));
    let best=null,bs=-1e9;
    for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++){
      if(S.pairsSeen.has(pk(pool[i],pool[j])))continue;
      let s=scorePair(pool[i],pool[j],axis,S.phase);
      if(reuse)s-=(S.used.has(pool[i].id)?.6:0)+(S.used.has(pool[j].id)?.6:0);
      if(s>bs){bs=s;best={a:pool[i],b:pool[j],axis}}
    }
    if(best)return finalize(best);
  }
  if(!S.widen){
    // very narrow taste: rather than stop, mix in neighbouring genres (never the "never" ones)
    S.widen=true;S.log.unshift("Running low on titles in your genres. Mixing in a few neighbours");
    return nextPair();
  }
  return null;
}
function finalize(p){
  S.pairsSeen.add(pk(p.a,p.b));
  if(Math.random()<.5)[p.a,p.b]=[p.b,p.a];
  S.used.add(p.a.id);S.used.add(p.b.id);
  p.unseenCount=0;p.pitch=false;
  return p;
}
function whyThisPair(p){
  const fmt=p.a.k==="tv"?" Series are only ever compared with series.":"";
  if(p.axis==="crew")return `Zooming in on creators. Both are close to your taste so far. The question is whose style you trust: ${p.a.crew} or ${p.b.crew}.${fmt}`;
  const shared=AX.filter(b=>b!==p.axis&&Math.abs(val(p.a,b)-val(p.b,b))<.45&&Math.abs((val(p.a,b)+val(p.b,b))/2)>.35)
    .slice(0,2).map(b=>LBL[b][(val(p.a,b)+val(p.b,b))>0?1:0].toLowerCase());
  const phaseTxt=S.phase==="wide"?"Casting a wide net with well-known titles from your genres.":S.phase==="narrow"?(p.axis==="humor"?"You lean funny, so now: what kind of funny?":"You watch series, so: how much commitment?"):"Refining inside your territory.";
  return `${phaseTxt} I'm only ${Math.round(conf(p.axis)*100)}% sure about this one.${shared.length?` Both are ${shared.join(" and ")}, so the main difference is ${TEST[p.axis]}.`:""}${fmt}`;
}
function replaceSide(side){
  const p=S.pair,o=p[side],other=side==="a"?p.b:p.a;
  S.unseen.add(o.id);
  if(o.pop<.55)nudge("indie",-.6,.35,`Hasn't seen ${o.t} (less known). Leans a little mainstream`);
  else S.log.unshift(`Hasn't seen ${o.t}. Swapped it for something similar`);
  p.unseenCount++;
  if(p.unseenCount>=2){p.pitch=true;return}
  let best=null,bs=-1e9;
  for(const c of TITLES){
    if(!allowed(c,o.k)||S.unseen.has(c.id)||c.id===other.id||c.id===o.id)continue;
    if(OPT.includes(p.axis)&&c[p.axis]===undefined)continue;
    if(p.axis==="crew"&&(!c.crew||c.crew===other.crew))continue;
    const ax=p.axis==="crew"?null:p.axis;
    let s=c.pop*1.4-(S.used.has(c.id)?1.2:0);
    if(ax)s-=Math.abs(val(c,ax)-val(o,ax))*2.5;
    for(const b of AX)if(b!==ax)s-=Math.abs(val(c,b)-val(o,b))*.15;
    if(s>bs){bs=s;best=c}
  }
  if(!best){p.pitch=true;return}
  S.used.add(best.id);p[side]=best;p.swapped=side;
}
function nudge(a,dir,w,msg){S.sv[a]+=dir*w;S.sw[a]+=Math.abs(dir)*w;if(msg)S.log.unshift(msg)}
function genreSignal(win,lose){
  for(const g of win.g)if(S.gen[g]>-5)S.gen[g]=+(S.gen[g]+.15).toFixed(2);
  for(const g of lose.g)if(S.gen[g]>-5&&!win.g.includes(g))S.gen[g]=+(S.gen[g]-.08).toFixed(2);
}
function choose(side){
  const p=S.pair,c=p[side],o=side==="a"?p.b:p.a,w=p.pitch?.6:1;
  const before={};for(const a of [...AX,...OPT])before[a]=conf(a);
  if(p.axis!=="crew"){
    const a=p.axis,e=est(a),d=val(c,a)-val(o,a);
    if(conf(a)>.5&&Math.abs(e)>.35&&Math.sign(d)!==Math.sign(e)&&Math.abs(d)>.7&&S.huhCount<2)S.pendingHuh={a,c,o};
  }
  const moved=[];
  for(const a of [...AX,...OPT]){
    const vc=val(c,a),vo=val(o,a);
    if(vc===undefined||vo===undefined)continue;
    const d=vc-vo;if(Math.abs(d)<.15)continue;
    const f=(a===p.axis||p.axis==="crew")?1:.3;
    S.sv[a]+=d*w*f;S.sw[a]+=Math.abs(d)*w*f;
    if(Math.abs(d)>.8&&f===1)moved.push(LBL[a][d>0?1:0].toLowerCase());
    if(a===p.axis)S.lastUpd={a,d:d*w*f};
  }
  if(c.crew)S.crew[c.crew]=(S.crew[c.crew]||0)+1;
  if(o.crew)S.crew[o.crew]=(S.crew[o.crew]||0)-.3;
  genreSignal(c,o);
  S.log.unshift(`${p.pitch?"Would rather watch":"Picked"} ${c.t} over ${o.t}${moved.length?`: ${moved.slice(0,2).join(", ")}`:""}${p.pitch?" (half weight, hasn't seen either)":""}`);
  S.learned="";
  for(const a of [...AX,...OPT]){if(before[a]<.5&&conf(a)>=.5&&Math.abs(est(a))>.3){S.learned=`Noted: ${LBL[a][est(a)>0?1:0].toLowerCase()} wins for you.`;break}}
  if(!S.learned&&c.crew&&S.crew[c.crew]>=2)S.learned=`${c.crew} again. Noted.`;
  S.round++;
}
function sharedMove(sign,msg,learned){
  const p=S.pair;
  for(const a of AX){
    const va=val(p.a,a),vb=val(p.b,a);
    if(Math.sign(va)===Math.sign(vb)&&Math.abs(va)>.35&&Math.abs(vb)>.35){const m=(va+vb)/2;S.sv[a]+=sign*m*.6;S.sw[a]+=Math.abs(m)*.6}
  }
  for(const t of [p.a,p.b]){if(t.crew)S.crew[t.crew]=(S.crew[t.crew]||0)+(sign>0?.8:-.5);for(const g of t.g)if(S.gen[g]>-5)S.gen[g]=+(S.gen[g]+(sign>0?.1:-.1)).toFixed(2)}
  S.log.unshift(msg);S.learned=learned;S.round++;
}
const loveBoth=()=>sharedMove(1,`Loves both ${S.pair.a.t} and ${S.pair.b.t}. Learning from what they share`,"Love both? Then I'll learn from what they have in common.");
const neither=()=>sharedMove(-1,`Neither ${S.pair.a.t} nor ${S.pair.b.t}. Steering away from what they share`,"Neither? Then I'll steer away from what they have in common.");

/* ============ mirror statements ============ */
const SAY={
  tone:["You take your stories seriously. Jokes can wait.","You want to laugh, even when the stakes are high."],
  energy:["A great conversation beats a great explosion.","You'd rather watch it happen than hear about it."],
  pace:["You'll give a slow burn the time it needs.","If it drags, you're out."],
  dark:["You want to leave feeling better than you came in.","You're drawn to the darker side of people."],
  complex:["After a long day, you want a story that just flows.","You like a story that makes you work a little."],
  fantastic:["You like stories that could actually happen.","Give you another world over this one."],
  modern:["You've got a soft spot for the classics.","You lean toward newer stuff."],
  indie:["Big crowd-pleasers are your happy place.","You'll take an odd little gem over a blockbuster."],
  humor:["Big, silly comedy? Absolutely.","Dry, witty humor beats slapstick."],
  commit:["You like a show that knows when to end.","Give you a show you can live in for years."],
};
function mirrorCandidate(){
  if(!S.asked.has("combo")&&est("tone")>.3&&est("dark")>.3&&conf("tone")>.35&&conf("dark")>.35)
    return {key:"combo",text:"You like your darkness with a punchline.",axes:["tone","dark"],dir:[1,1]};
  const topCrew=Object.entries(S.crew).sort((x,y)=>y[1]-x[1])[0];
  if(topCrew&&topCrew[1]>=2&&!S.asked.has("crew:"+topCrew[0]))
    return {key:"crew:"+topCrew[0],text:`You trust ${topCrew[0]}. Whatever they make, you're in.`,crew:topCrew[0]};
  let best=null,bs=0;
  for(const a of [...AX,...OPT]){
    if(S.asked.has(a)||conf(a)<.35||Math.abs(est(a))<.3)continue;
    const s=Math.abs(est(a))*conf(a);if(s>bs){bs=s;best=a}
  }
  if(!best)return null;
  return {key:best,text:SAY[best][est(best)>0?1:0],axes:[best],dir:[est(best)>0?1:-1]};
}
function evidenceFor(m){
  const picks=S.log.filter(l=>l.startsWith("Picked")).map(l=>l.replace(/^Picked /,"").split(" over ")[0]).map(n=>TITLES.find(t=>t.t===n)).filter(Boolean);
  let ev;
  if(m.crew)ev=picks.filter(t=>t.crew===m.crew);
  else ev=picks.filter(t=>m.axes.every((a,i)=>(val(t,a)??0)*m.dir[i]>.3));
  ev=[...new Set(ev)].slice(0,2);
  return ev.length?`Because you picked <em>${ev.map(t=>esc(t.t)).join("</em> and <em>")}</em>.`:"Based on your picks so far.";
}

/* ============ recommendations (used by level-ups and the hub) ============ */
function recScore(t){
  let s=0;const parts=[];
  for(const a of AX){const k=val(t,a)*est(a)*conf(a);s+=k;parts.push({a,k})}
  for(const a of OPT)if(t[a]!==undefined&&S.sw[a]>0)s+=t[a]*est(a)*conf(a);
  if(t.crew&&(S.crew[t.crew]||0)>=1.5)s+=.8;
  s+=genreAff(t)*.25;
  parts.sort((x,y)=>y.k-x.k);
  return {t,s,parts};
}
function topRecs(n){
  const base=[...REC,...TITLES.filter(t=>!S.used.has(t.id))];
  const rank=arr=>arr.map(recScore).sort((x,y)=>y.s-x.s);
  const strict=rank(base.filter(t=>allowed(t)));
  if(strict.length>=n)return strict.slice(0,n);
  // not enough in their genres: keep those first, top up from neighbours
  const w=S.widen;S.widen=true;const extra=rank(base.filter(t=>allowed(t)&&!strict.some(x=>x.t===t)));S.widen=w;
  return [...strict,...extra].slice(0,n);
}

function advance(){

}

function drawCurtain(){
  const phases=[["wide","1 · Wide net"],["narrow","2 · Narrowing"],["deep","3 · Zooming in"]];
  const idx=phases.findIndex(p=>p[0]===S.phase);
  const p=S.pair,scr=S.screen,inGame=scr==="game";
  let phaseHTML=phases.map((ph,i)=>`<span class="${i===idx?'on':i<idx?'done':''}">${ph[1]}</span>`).join(""),testing="";
  const T=(h,b)=>`<div class="testing">${h}</div><p class="testing-why">${b}</p>`;
  if(scr==="intro")testing=T("Waiting to start","First the cheapest question there is: which genres. Then the user only ever picks between two titles.");
  else if(scr==="setup")testing=T("Genres and format","Love, like or never, and skipping counts as meh. Love and Like genres feed everything (Love weighs double). Never is blocked everywhere: training, games and picks.");
  else if(scr==="duel"&&p)testing=T(`Testing: ${p.axis==="crew"?"whose style you trust":TEST[p.axis]}${p.pitch?" (by description)":""}`,p.pitch?"They haven't seen either, so I'm asking which <em>sounds</em> better. It counts for less.":whyThisPair(p));
  else if(scr==="mirror")testing=T("Checking a hunch","I'm confident enough to say it out loud. A yes locks it in. A no means I read it wrong, and I'll test it again.");
  else if(scr==="huh")testing=T("Surprise!","That pick went against a strong pattern. Asking now feels natural and is really useful.");
  else if(scr==="levelup")testing=T("Level up","Make the payoff visible: a new feature unlocks, and the top pick often changes on the spot.");
  else if(scr==="bonusIntro"||scr==="levelDone"||S.bonus){phaseHTML=`<span class="on">Level ${S.tl}</span><span>Bonus round</span>`;testing=T(S.bonus?BONUS[S.bonus.type].name:scr==="levelDone"?`Level ${S.tl} complete`:"Bonus round coming up",S.bonus?BONUS[S.bonus.type].teach:"Every level = 6 regular picks + 1 bonus round. The bonus format rotates, so training never feels like the same screen forever. Chapters (big unlocks) come from how well I know you, not from how many levels you play.")}
  else if(scr==="games"){phaseHTML='<span class="on">Games</span>';testing=T("The arcade","A separate world with its own look. Every game feeds the same taste profile, each from a different angle. Every game has 5 levels, so there's always a next thing to play.")}

  else testing=T("Profile","Everything shown here is backed by things the user did. Nothing is guessed out of thin air.");
  const crews=Object.entries(S.crew).filter(([,v])=>v>=.9).sort((x,y)=>y[1]-x[1]);

  curtain.innerHTML=`
  <div class="panel"><h3>Behind the curtain</h3><div class="phase">${phaseHTML}</div>${testing}</div>
  ${S.screen==="bonus"&&S.cup?bracketPanel():""}
  ${(inGame&&S.game.id==="bet")||S.betHistory.length?calibPanel():""}
  <div class="panel"><h3>What WTW believes so far</h3>
    <div class="axes">${[...AX,...OPT.filter(a=>S.sw[a]>0)].map(a=>axisRow(a)).join("")}</div>
    <div class="conf-note">Dot position = which way they lean. Brighter dot = more confident.${S.crowdN?` · Trusts critics & crowd: ${S.crowdTrust>=0?"+":""}${S.crowdTrust.toFixed(1)}`:""}</div>
  </div>

  <div class="panel"><h3>Creators they trust</h3>${crews.length?`<div class="chips">${crews.map(([n])=>`<span class="chip">${esc(n)}</span>`).join("")}</div>`:`<div class="empty-note">Shows up after a couple of picks from the same director, writer or studio.</div>`}</div>

function recRows(recs){
  const crews=Object.entries(S.crew).filter(([,v])=>v>=1.5).map(([n])=>n);
  const maxS=Math.max(.01,recs[0]?.s||.01);
  const reason=r=>{
    if(r.t.crew&&crews.includes(r.t.crew))return `It's ${r.t.crew}, and you trust them.`;

function predict(t){
  let s=0,cs=0;
  for(const a of AX){s+=val(t,a)*est(a)*conf(a);cs+=conf(a)}
  for(const a of OPT)if(t[a]!==undefined&&S.sw[a]>0){s+=t[a]*est(a)*conf(a);cs+=conf(a)}
  if(t.crew)s+=Math.max(-1,Math.min(1.5,(S.crew[t.crew]||0)*.4));
  s+=genreAff(t)*.5;
  const norm=s/Math.max(1.2,cs*.45);
  const raw=3.2+norm*1.9+S.betBias;
  return {pred:Math.max(1,Math.min(5,Math.round(raw))),raw,norm};
}

function betSettle(r){
  const b=S.game.b,t=b.cur,{pred,raw}=b.P;

  S.betHistory.push({id:t.id,t:t.t,pred,r});

  if(Math.abs(S.betBias)>.3&&Math.abs(S.betBias)-Math.abs(oldBias)>.2)note=S.betBias>0?"You rate generously. Adjusting.":"Tough critic. Adjusting.";

  S.log.unshift(`The Bet: ${t.t}. Bet ${pred}★, rated ${r}★. Point to ${kind==="wtw"?"WTW":"you"}`);

}

const RNAME={32:["Round of 32","Round of 16","Quarter-finals","Semi-finals","Final"],16:["Round of 16","Quarter-finals","Semi-finals","Final"],8:["Quarter-finals","Semi-finals","Final"]};
function koOptions(){
  const pick=gs=>gs.map(g=>({...g,n:g.n,cnt:TITLES.filter(t=>t.g.includes(g.id)&&!t.g.some(x=>S.gen[x]<=-5)).length})).filter(o=>o.cnt>=8);
  const mine=pick(GENRES.filter(g=>loves().includes(g.id)));

}
function koInit(gid,lv){
  const g=GENRES.find(x=>x.id===gid);
  let pool=TITLES.filter(t=>t.g.includes(gid)&&!t.g.some(x=>S.gen[x]<=-5));
  if(lv<2&&pool.filter(t=>t.k==="m").length>=8)pool=pool.filter(t=>t.k==="m");
  pool.sort((x,y)=>y.pop-x.pop);
  const size=lv>=1&&pool.length>=16?16:8;
  let axis="humor";
  if(gid!=="comedy"||pool.filter(t=>t.humor!==undefined).length<size){
    let bv=-1;for(const a of AX){const vs=pool.slice(0,size).map(t=>val(t,a)),m=vs.reduce((s,x)=>s+x,0)/vs.length,v=vs.reduce((s,x)=>s+(x-m)**2,0);if(v>bv){bv=v;axis=a}}
  }
  const main=pool.filter(t=>val(t,axis)!==undefined).slice(0,size);
  const reserves=pool.filter(t=>!main.includes(t)&&val(t,axis)!==undefined);
  main.sort((x,y)=>val(x,axis)-val(y,axis));
  const ms=[];for(let i=0;i<size/2;i++)ms.push({a:main[i],b:main[size-1-i],pitch:false});
  shuffle(ms).forEach((m,i)=>{if(Math.random()<.5)[m.a,m.b]=[m.b,m.a];ms[i]=m});
  S.cup={gid,name:`${g.n} Knockout`,axis,size,r:0,rounds:[shuffle(ms)],mi:0,reserves,wins:{hi:0,lo:0},crewWins:{},step:"match"};
  S.log.unshift(`Started ${S.cup.name}. Round 1 pairs opposite ends of ${TEST[axis]}`);
}
function koRender(topHTML){

function koPick(k){
  const C=S.cup,m=C.rounds[C.r][C.mi],w=m[k],l=k==="a"?m.b:m.a,wt=m.pitch?.6:1;
  m.w=w;
  const d=val(w,C.axis)-val(l,C.axis);
  if(Math.abs(d)>.3){S.sv[C.axis]+=d*wt;S.sw[C.axis]+=Math.abs(d)*wt;C.wins[d>0?"hi":"lo"]++}
  for(const a of AX){if(a===C.axis)continue;const dd=val(w,a)-val(l,a);if(Math.abs(dd)>.6){S.sv[a]+=dd*.2*wt;S.sw[a]+=Math.abs(dd)*.2*wt}}
  if(w.crew){S.crew[w.crew]=(S.crew[w.crew]||0)+.7;C.crewWins[w.crew]=(C.crewWins[w.crew]||0)+1}
  genreSignal(w,l);
  S.log.unshift(`Knockout: ${w.t} beat ${l.t}${Math.abs(d)>.3?` (${LBL[C.axis][d>0?1:0].toLowerCase()} wins)`:""}`);
  const {hi,lo}=C.wins;
  S.learned=hi>=3&&hi>lo*2?`${LBL[C.axis][1]} keeps winning.`:lo>=3&&lo>hi*2?`${LBL[C.axis][0]} keeps winning.`:"";
}
function koUnseen(k){
  const C=S.cup,m=C.rounds[C.r][C.mi],t=m[k];
  if(C.r===0&&C.reserves.length){
    C.reserves.sort((x,y)=>Math.abs(val(x,C.axis)-val(t,C.axis))-Math.abs(val(y,C.axis)-val(t,C.axis)));
    const rep=C.reserves.shift();m[k]=rep;S.learned="Swapped in a similar title.";S.log.unshift(`Knockout: hasn't seen ${t.t}, swapped in ${rep.t}`);
  } else {m.pitch=true;S.learned="";S.log.unshift(`Knockout: hasn't seen ${t.t}. Judging by description (half weight)`)}
}
function koNext(){
  const C=S.cup,names=RNAME[C.size];C.mi++;
  if(C.mi<C.rounds[C.r].length)return;
  if(C.r===names.length-1){
    const f=C.rounds[C.r][0],champ=f.w,ru=f.w===f.a?f.b:f.a,{hi,lo}=C.wins,H=LBL[C.axis][1],Lo=LBL[C.axis][0];
    const lines=[hi>lo?`${H} beat ${Lo.toLowerCase()} ${hi}–${lo} in your bracket.`:lo>hi?`${Lo} beat ${H.toLowerCase()} ${lo}–${hi} in your bracket.`:`${H} and ${Lo.toLowerCase()} split evenly.`];
    const f4=C.rounds[Math.max(0,C.rounds.length-2)].flatMap(m=>[m.a,m.b]);
    if(f4.every(t=>t.y>=2000))lines.push("Your final four are all from 2000 or later.");else if(f4.every(t=>t.y<2000))lines.push("Your final four are all pre-2000 classics.");
    const cw=Object.entries(C.crewWins).sort((x,y)=>y[1]-x[1])[0];if(cw&&cw[1]>=2)lines.push(`${cw[0]} won ${cw[1]} matches.`);
    const line=hi>lo?SAY[C.axis][1]:lo>hi?SAY[C.axis][0]:null;if(line&&!S.truths.includes(line)){S.truths.push(line);lines.push(`Added to your profile: “${line}”`)}
    finishBonus({top:`<div class="champ" style="width:100%"><div class="eyebrow">Your champion</div><div class="champ-poster">${posterHTML(champ)}</div><h2>${esc(champ.t)}</h2><div class="ru">beat ${esc(ru.t)} in the final</div></div>`,
      headline:`${C.name}: done`,lines});
    return;
  }
  const ws=C.rounds[C.r].map(x=>x.w),next=[];
  for(let i=0;i<ws.length;i+=2)next.push({a:ws[i],b:ws[i+1],pitch:false});
  C.rounds.push(next);C.r++;C.mi=0;C.step="round";
}
function bracketPanel(){
  const C=S.cup,heads={16:["R16","QF","SF","FINAL"],8:["QF","SF","FINAL"]}[C.size];

}

  });
  const next=()=>{R.i++;R.step="vote";if(R.i>=R.items.length){
    const n=R.items.length-R.skipped,contra=n?Math.round((R.votes.over+R.votes.under)/n*100):0;
    endGame({big:`${contra}%`,headline:contra>=60?"Certified contrarian.":contra>=35?"You think for yourself.":"Crowd-pleaser, and proud of it.",
      lines:[`You disagreed with the crowd's ranking ${contra}% of the time.`,R.votes.over>R.votes.under?"You find acclaimed titles overrated more than underrated.":R.votes.under>R.votes.over?"You think the crowd undersells things more often than not.":"Your disagreements go both ways.",
        contra>=50?"I'll lean less on critic and crowd scores when I pick for you.":"Critic and crowd scores are a good guide for you, so I'll keep using them."],logline:`contrarian ${contra}%`});
  }render()};
  if($("#nx"))$("#nx").onclick=next;
  if($("#nosee"))$("#nosee").onclick=()=>{R.skipped++;S.unseen.add(t.id);S.log.unshift(`Overrated/Underrated: hasn't seen ${t.t}`);next()};
}

/* ============ game: Mind Reader ============ */
function mindInit(){S.game.md={n:8+Math.min(4,S.gp.mind.level*2),i:0,right:0,step:"guess",pair:null};mindNext()}
function mindNext(){
  const M=S.game.md;M.pair=nextPair();M.step="guess";
  if(!M.pair){M.i=M.n;return}
  const pa=predict(M.pair.a).raw,pb=predict(M.pair.b).raw;M.guess=pa>=pb?"a":"b";M.sure=Math.abs(pa-pb)>.6;
}
function mindRender(){
  const M=S.game.md;
  if(M.i>=M.n){
    const pct=Math.round(M.right/Math.max(1,M.n)*100);
    endGame({big:`${M.right}/${M.n}`,headline:pct>=75?"I read your mind.":pct>=50?"Getting warmer.":"You're hard to read. Good, that's how I learn.",
      lines:[`I guessed ${M.right} of ${M.n} picks right (${pct}%).`,M.n-M.right?`The ${M.n-M.right} I got wrong corrected your profile exactly where I was weakest.`:"Not one miss. Your profile is in great shape.","Every pick here counts just like in Train my taste."],logline:`${M.right}/${M.n} read`});
    return render();
  }
  const p=M.pair,shown=M.step!=="guess";
  const side=k=>`<div class="side"><div class="pick ${shown&&k===M.guess?"guessed":""}">${posterHTML(p[k])}<div><div class="nm">${esc(p[k].t)}</div><div class="yr">${p[k].y}</div>${shown&&k===M.guess?'<span class="guess-tag">MY GUESS</span>':""}</div></div></div>`;
  host.innerHTML=`<div class="screen">${gameTop()}
    <div class="ptsrow" style="padding:4px 22px 0"><span>Round ${M.i+1} of ${M.n}</span><span>Read right: <b>${M.right}</b></span></div>
    <div class="prompt"><h2>${shown?(M.sure?"I'm pretty sure it's this one.":"My gut says this one."):"I've picked the one you'd choose."}</h2><p>${shown?"Am I right?":"Ready to see my guess?"}</p></div>
    <div class="duel mind">${side("a")}${side("b")}</div>
    <div class="actions">${shown?`<button class="opt primary" id="right" style="flex:1">Right</button><button class="opt" id="wrong" style="flex:1">Wrong</button>`:`<button class="cta" id="reveal" style="max-width:none">Reveal my guess</button>`}</div>
    ${shown?"":`<div class="actions" style="padding-top:0"><button class="ghost" id="skipm">Haven't seen one, skip</button></div>`}
  </div>`;
  if($("#reveal"))$("#reveal").onclick=()=>{M.step="shown";render()};
  if($("#skipm"))$("#skipm").onclick=()=>{S.log.unshift("Mind Reader: skipped a pair");mindNext();render()};
  const ans=right=>{
    const side=right?M.guess:(M.guess==="a"?"b":"a");
    S.pair=p;choose(side);S.pendingHuh=null;
    if(right)M.right++;
    S.log[0]=`Mind Reader: ${right?"read right":"misread"}. `+S.log[0];
    toast(right?"Called it":"Noted. Adjusting.");M.i++;mindNext();render();
  };
  if($("#right"))$("#right").onclick=()=>ans(true);
  if($("#wrong"))$("#wrong").onclick=()=>ans(false);
}

/* ============ training levels: bonus rounds ============ */
const PER_LEVEL=6;
const BONUS={
  knockout:{name:"Knockout",icon:"K",desc:"8 titles from one of your genres. Head to head until one champion is left.",teach:"A quick bracket inside one genre. Round 1 pairs opposites on the scale I'm least sure about, so every match is a clean test."},
  lightning:{name:"Lightning round",icon:"⚡",desc:"10 picks, 30 seconds. Don't think, just tap.",teach:"Gut reactions with no time to overthink. Fast answers are often the most honest ones."},
  deepdive:{name:"Deep dive",icon:"D",desc:"6 picks, all from one genre you love.",teach:"Fine detail inside one genre: what kind of comedy, what kind of crime. That's where the best picks come from."},
  creators:{name:"Creators round",icon:"C",desc:"5 picks between directors, writers and studios.",teach:"Zooming in on the people behind the titles. Trust in a creator is one of the strongest signals there is."},
  series:{name:"Series round",icon:"S",desc:"5 picks, series only.",teach:"Series taste is different from movie taste: commitment, episode length, how much you binge."},
};
function bonusType(tl){
  const order=["knockout","lightning","deepdive","creators","series"];
  for(let i=0;i<order.length;i++){
    const t=order[(tl-1+i)%order.length];
    if(t==="series"&&S.format==="movies")continue;
    if(t==="knockout"&&!koOptions().length)continue;
    if(t==="creators"&&TITLES.filter(x=>x.crew&&allowed(x)).length<4)continue;
    return t;
  }
  return "lightning";
}
function bonusTop(){return `<div class="topbar"><button class="hb" data-menu aria-label="Open menu">${IC.menu}</button><div class="brand"><i></i>WTW</div></div><div style="text-align:center"><span class="bonus-badge">LEVEL ${S.tl} · BONUS ROUND</span></div>`}
function renderBonusIntro(){
  const type=bonusType(S.tl),B=BONUS[type];
  let extra="";
  if(type==="knockout"){const o=koOptions();S.koGenre=o[S.koTurn%o.length].id;extra=` Today: <b style="color:var(--fg)">${esc(GN[S.koGenre])}</b>.`}
  if(type==="deepdive"){const L=loves().filter(g=>TITLES.filter(t=>t.g.includes(g)&&allowed(t)).length>=6);S.ddGenre=L.length?L[(S.tl)%L.length]:null;if(S.ddGenre)extra=` Today: <b style="color:var(--fg)">${esc(GN[S.ddGenre])}</b>.`}
  const order=["knockout","lightning","deepdive","creators","series"];
  host.innerHTML=`<div class="screen">${mainTop()}
    <div class="inter"><span class="bonus-badge">LEVEL ${S.tl} · BONUS ROUND</span>
      <div class="lvl-badge" style="background:radial-gradient(circle at 30% 20%,#bfe8ff,#7fd1ff 60%,#2d7fb0);box-shadow:0 0 50px rgba(127,209,255,.45)">${B.icon}</div>
      <h2>${esc(B.name)}</h2><div class="evidence">${esc(B.desc)}${extra}</div>
      <div class="btype">${order.map((t,i)=>`<div class="${t===type?"now":""}"><span>${BONUS[t].name}</span><span>${t===type?"this level":"rotates in"}</span></div>`).join("")}</div>
      <div class="opts"><button class="opt primary" id="bgo" style="background:#7fd1ff;border-color:#7fd1ff;color:#0b0820">Start</button><button class="skip" id="bskip">Skip the bonus</button></div>
    </div></div>`;
  $("#bgo").onclick=()=>startBonus(type);
  $("#bskip").onclick=()=>{S.log.unshift(`Skipped the level ${S.tl} bonus round`);finishBonus({headline:"Bonus skipped",lines:["No problem. The next level has a different bonus format."]})};
}
function startBonus(type){
  S.log.unshift(`Level ${S.tl} bonus: ${BONUS[type].name}`);S.learned="";
  if(type==="knockout"){S.bonus={type};S.koTurn++;koInit(S.koGenre,S.tl>6?1:0);S.cup.step="match";S.screen="bonus";return render()}
  S.bonus={type,left:type==="lightning"?10:type==="deepdive"?6:5,picks:0,t0:Date.now(),limit:30000};
  if(type==="series")S.bonus.kind="tv";
  if(type==="deepdive"&&S.ddGenre)S.bonus.genre=S.ddGenre;
  if(type==="creators"&&S.format==="series")S.bonus.kind="tv";
  S.pair=nextPair();
  if(!S.pair){return finishBonus({headline:"Ran out of titles for this one",lines:["Skipping ahead to the next level."]})}
  S.screen="duel";render();
}
function bonusBanner(){
  const b=S.bonus,B=BONUS[b.type];
  const lt=b.type==="lightning";
  const rem=lt?Math.max(0,Math.ceil((b.limit-(Date.now()-b.t0))/1000)):0;
  return `<div class="bbanner"><div class="row"><span><b>${esc(B.name)}</b>${b.genre?` · ${esc(GN[b.genre])}`:""}</span><span>${b.left} left${lt?` · <b id="ltime">${rem}s</b>`:""}</span></div>${lt?`<div class="tbar"><i id="lbar" style="width:${rem/30*100}%"></i></div>`:""}</div>`;
}
let LT=null;
function lightningTick(){
  clearInterval(LT);
  LT=setInterval(()=>{
    const b=S.bonus;if(!b||b.type!=="lightning"){clearInterval(LT);return}
    const rem=Math.max(0,b.limit-(Date.now()-b.t0));
    const t=document.getElementById("ltime"),bar=document.getElementById("lbar");
    if(t)t.textContent=Math.ceil(rem/1000)+"s";if(bar)bar.style.width=(rem/b.limit*100)+"%";
    if(rem<=0){clearInterval(LT);endBonus(true)}
  },250);
}
function bonusAdvance(){
  const b=S.bonus;S.pendingHuh=null;b.left--;b.picks++;
  if(b.left<=0)return endBonus(false);
  if(b.type==="lightning"&&Date.now()-b.t0>=b.limit)return endBonus(true);
  S.pair=nextPair();if(!S.pair)return endBonus(false);
  S.screen="duel";render();
}
function endBonus(timeout){
  clearInterval(LT);
  const b=S.bonus,B=BONUS[b.type],secs=Math.round((Date.now()-b.t0)/1000);
  const lines=[];
  if(b.type==="lightning")lines.push(timeout?`Time's up: ${b.picks} gut picks in 30 seconds.`:`${b.picks} gut picks in ${secs} seconds.`);
  else lines.push(`${b.picks} picks${b.genre?` inside ${GN[b.genre]}`:b.type==="series"?" between series":b.type==="creators"?" between creators":""}.`);
  const top=Object.entries(S.crew).sort((x,y)=>y[1]-x[1])[0];
  if(b.type==="creators"&&top&&top[1]>=1.5)lines.push(`${top[0]} is now one of your trusted creators.`);
  if(b.type==="series"&&conf("commit")>.35)lines.push(SAY.commit[est("commit")>0?1:0]);
  const strongest=[...AX,...OPT].filter(a=>conf(a)>.4).sort((x,y)=>Math.abs(est(y))*conf(y)-Math.abs(est(x))*conf(x))[0];
  if(strongest)lines.push(`Clearest thing so far: ${SAY[strongest][est(strongest)>0?1:0].toLowerCase()}`);
  finishBonus({headline:`${B.name}: done`,lines});
}
function finishBonus(sm){
  clearInterval(LT);
  S.bonusSummary=sm;S.bonus=null;S.screen="levelDone";render();
}
function renderLevelDone(){
  const sm=S.bonusSummary||{headline:"",lines:[]},next=BONUS[bonusType(S.tl+1)];
  host.innerHTML=`<div class="screen">${mainTop()}${meterHTML()}
    <div class="gover"><span class="bonus-badge">LEVEL ${S.tl} COMPLETE</span>
      ${sm.top||""}<h2>${esc(sm.headline)}</h2>
      ${sm.lines.length?`<div class="learned-box"><h4>What I learned</h4><ul>${sm.lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></div>`:""}
      <div class="delta">Next: <b style="color:var(--fg)">Level ${S.tl+1}</b> · 6 picks, then a <b style="color:#7fd1ff">${esc(next.name)}</b></div>
      <button class="cta" id="nextlv">Start level ${S.tl+1}</button>
    </div></div>`;
  $("#nextlv").onclick=()=>{
    S.tl++;S.lvPicks=0;S.cup=null;S.log.unshift(`Level ${S.tl} started`);
    if(S.tl===5&&!S.revealed){S.screen="hub";return render()}
    S.learned="";S.topBefore=topRecs(1)[0]?.t.t;S.pair=nextPair();S.screen=S.pair?"duel":"hub";render();
  };
}

/* ============ demo + boot ============ */
function seedDemo(){
  fresh();
  S.format="both";Object.assign(S.gen,{comedy:2,crime:2,horror:1,scifi:1,war:1,drama:-.5,romance:-9});S.sel=new Set(["comedy","crime","horror","scifi","war"]);
  S.log.unshift("Demo profile: watches both. Love: Comedy, Crime. Like: Horror, Sci-fi, War. Never: Romance");
  const me={tone:.7,dark:.6,energy:.3,pace:.3,complex:.3,fantastic:0,modern:.2,indie:.2};
  const util=t=>AX.reduce((s,a)=>s+me[a]*val(t,a),0)+(t.crew==="Edgar Wright"?1:0);
  for(let i=0;i<16;i++){S.pair=nextPair();if(!S.pair)break;choose(util(S.pair.a)>=util(S.pair.b)?"a":"b")}
  S.pendingHuh=null;S.learned="";S.level=levelIdx(knowledge());S.revealed=true;
}
function start(){fresh();render()}
$("#restart").onclick=start;
start();

</script>
